# Secret-free OIDC enforcement check 2a: NON-MAIN branch + environment.
# Branch test/oidc-nonmain, job declares environment staging-http-checks.
# GitHub deployment-branch policy (main only) is expected to block this job.
# This tests the GITHUB layer only, NOT Vercel branch enforcement.
# Token NEVER printed, logged, stored, or included in any output.
name: oidc-check-nonmain-env
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging-http-checks
    steps:
      - name: Non-main-environment check (classification only)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            const ORIGIN = 'https://family-wealth-os-git-6df994-andres-felipe-garzon-diazs-projects.vercel.app';
            const CANON = 'family-wealth-os-git-6df994-andres-felipe-garzon-diazs-projects.vercel.app';
            const res = await fetch(ORIGIN + '/', { method: 'GET', redirect: 'manual', headers: { 'x-vercel-trusted-oidc-idp-token': token } });
            const status = res.status;
            const loc = res.headers.get('location');
            let locCat = 'none';
            if (loc) {
              try {
                if (loc.startsWith('/') && !loc.startsWith('//') && !loc.includes('\\')) locCat = 'app_same_origin';
                else {
                  const u = new URL(loc, ORIGIN);
                  if (u.hostname === CANON) locCat = 'app_same_origin';
                  else if (u.hostname === 'vercel.com' || u.hostname.endsWith('.vercel.com')) locCat = 'vercel_sso';
                  else locCat = 'other';
                }
              } catch { locCat = 'other'; }
            }
            const body = await res.text();
            let cls = 'other';
            if (status === 401 && body.includes('"code":"401"')) cls = 'vercel_edge';
            else if (status === 302 && locCat === 'vercel_sso') cls = 'vercel_sso';
            else if (status === 200) cls = 'app';
            else if (status === 302 && locCat === 'app_same_origin') cls = 'app';
            core.info(`check=nonmain_env http_status=${status} classification=${cls} location_category=${locCat} expected_denied=${cls !== 'app' ? 'yes' : 'no'}`);
            if (cls === 'app') core.setFailed('non-main-environment token reached app');
